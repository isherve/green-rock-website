name: Deploy Frontend Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  vercel-preview:
    name: Vercel Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://green-rock-api.onrender.com/api' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://green-rock-website.vercel.app' }}

  # Connect Vercel/Netlify to GitHub for automatic production deploys:
  # - Vercel: vercel.com → Import Project → root: frontend
  # - Netlify: netlify.com → Import → base: frontend
